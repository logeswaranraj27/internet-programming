
<!DOCTYPE html>
<html>
<head>
<title>Hotel Booking</title>
</head>
<body>
<h1>Hotel Room Booking</h1>
<form onsubmit="bookRoom(event)">
Name: <input id="name" required><br><br>
Room:
<select id="room">
<option>Single</option>
<option>Double</option>
<option>Deluxe</option>
</select><br><br>
Days: <input id="days" type="number" min="1" required><br><br>
<button type="submit">Book Room</button>
</form>
<p id="result"></p>
<script>
function bookRoom(e) {
e.preventDefault();
let n = document.getElementById("name").value;
let r = document.getElementById("room").value;
let d = Number(document.getElementById("days").value);
let price = r == "Single" ? 1000 : r == "Double" ? 2000 : 3000;
document.getElementById("result").innerHTML =
"Booking Confirmed for " + n + "<br>Room: " + r +
"<br>Total Amount: Rs. " + (price * d);
}
</script>
</body>
</html>
